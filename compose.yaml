services:
  api:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://ozserver:${POSTGRES_PASSWORD}@postgres:5432/ozserver
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    networks: [internal]

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ozserver
      POSTGRES_USER: ozserver
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ozserver -d ozserver"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

networks:
  internal:
    internal: true

volumes:
  postgres-data:
