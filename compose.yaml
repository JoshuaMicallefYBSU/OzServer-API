services:
  api:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # environment: wins over env_file:, so a .env copied from .env.example (the local dev
      # template, which sets NODE_ENV=development) cannot take the container out of production mode.
      NODE_ENV: production
      DATABASE_URL: postgres://ozserver:${POSTGRES_PASSWORD}@postgres:5432/ozserver
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    # The API needs outbound internet: status.vatsim.net and data.vatsim.net for the public map
    # (routes/map.ts), api.github.com for the plugin release check (plugin-release.ts),
    # raw.githubusercontent.com for dataset:sync, and discord.com when DISCORD_WEBHOOK_URL is set.
    # Sector ownership does not depend on this egress.
    # postgres is deliberately left off this network: it is reachable only from `internal`.
    networks: [egress, internal]

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ozserver
      POSTGRES_USER: ozserver
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ozserver -d ozserver"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

networks:
  egress:
  internal:
    internal: true

volumes:
  postgres-data:
