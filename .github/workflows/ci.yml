name: CI

# Every push and every pull request. The API is deployed straight from main by a timer on the VPS,
# so a break on main is a break in production within a minute or two - this is the only thing
# standing in front of that.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # A throwaway database for src/api.integration.test.ts, which exercises the routes against real
    # Postgres - the sector rules are mostly SQL, and nothing short of running it tests them.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the Dockerfile's base image, so a thing that compiles here compiles there.
          node-version: '22'
          cache: npm

      # ci, not install: builds from the lockfile exactly, which is the same guarantee the
      # deployment relies on.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/postgres

      # Proves the image the VPS will actually build still builds, without pushing it anywhere.
      # Catches a Dockerfile or dependency break before the deploy timer finds it in production.
      - name: Build image
        run: docker build -t ozserver-api:ci .
