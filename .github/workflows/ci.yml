name: CI

# Every push to main and every pull request. The API is deployed straight from main by a timer on
# the VPS, so a break on main reaches production within a minute or two.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # A throwaway database for src/api.integration.test.ts, which exercises the routes against real
    # Postgres: the sector rules are mostly SQL.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the Dockerfile's base image.
          node-version: '22'
          cache: npm

      # ci, not install: builds from the lockfile exactly, as the Dockerfile does.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/postgres

      # Proves the image the VPS will build still builds, without pushing it anywhere: a Dockerfile
      # or dependency break is caught here rather than by the deploy timer.
      - name: Build image
        run: docker build -t ozserver-api:ci .
